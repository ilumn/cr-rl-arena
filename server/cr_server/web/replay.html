<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Replay · Tournament standings</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23ffb829'/%3E%3Cpath d='M5 9l3.5 3L12 7l3.5 5L19 9l-1.2 7.4H6.2z' fill='%231a1200'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #090b10; --bg-2: #0e1118; --panel: #12161f; --panel-2: #171c27;
    --line: #222938; --line-2: #2c3446; --row: #1a1f2b;
    --fg: #eef1f7; --fg-2: #b9c0d0; --muted: #7d879c; --faint: #566076;
    --gold: #ffb829; --win: #3ddc97; --loss: #ff6166; --draw: #8f9ab3;
    --p0: #5aa8ff; --p1: #ff6f91; --elixir: #d95fd0;
    --disp: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    --body: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    --r: 14px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: var(--bg); }
  body { margin: 0; color: var(--fg); font: 14px/1.45 var(--body); font-feature-settings: "tnum"; -webkit-font-smoothing: antialiased; min-height: 100vh;
    background: radial-gradient(1200px 520px at 78% -160px, rgba(255,184,41,.10), transparent 62%), radial-gradient(900px 480px at 0% -120px, rgba(90,168,255,.09), transparent 60%), var(--bg); }
  button, input { font: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
  .wrap { max-width: 1280px; margin: 0 auto; padding-block: 18px 40px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); }
  .back { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-weight: 600; font-size: 13px; padding: 6px 10px 6px 6px; margin: 0 0 12px -6px; border-radius: 8px; }
  .back:hover { color: var(--fg); background: rgba(255,255,255,.04); }
  .brand { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; }
  .brand svg { flex: none; }
  .brand b { font: 600 19px/1 var(--disp); letter-spacing: .09em; text-transform: uppercase; }
  .brand span { color: var(--muted); font-size: 12.5px; }

  .stage { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px; align-items: start; justify-content: center; }
  .board { position: relative; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line-2); background: #1f4329; line-height: 0;
    box-shadow: 0 18px 50px rgba(0,0,0,.45); }
  canvas { display: block; cursor: crosshair; }
  .tip { position: absolute; pointer-events: none; z-index: 3; transform: translate(-50%, -100%); margin-top: -16px; background: #05070b; border: 1px solid var(--line-2); border-radius: 8px;
    padding: 5px 9px; font-size: 12px; line-height: 1.3; white-space: nowrap; text-transform: capitalize; box-shadow: 0 6px 20px rgba(0,0,0,.5); }
  .tip b { font-weight: 600; } .tip span { color: var(--muted); margin-left: 6px; }
  .over { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(9,11,16,.72); backdrop-filter: blur(3px); line-height: 1.4; text-align: center; padding: 24px; }
  .over b { display: block; font: 700 40px/1 var(--disp); letter-spacing: .04em; text-transform: uppercase; overflow-wrap: anywhere; }
  .over span { display: block; color: var(--fg-2); margin: 8px 0 16px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-2); background: var(--panel-2); border-radius: 9px; padding: 8px 14px; font-weight: 600; cursor: pointer; }
  .btn:hover { border-color: var(--gold); color: var(--gold); }

  .side { display: grid; gap: 14px; min-width: 0; max-width: 560px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
  .score { padding: 6px 0; }
  .pl { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 18px; }
  .pl + .pl { border-top: 1px solid var(--row); }
  .pl > i { width: 4px; align-self: stretch; border-radius: 3px; }
  .pl .seat { font: 600 10.5px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .pl .n { font: 600 25px/1.1 var(--disp); letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; color: var(--fg-2); }
  .pl.won .n { color: var(--fg); }
  .pl .cr { display: flex; align-items: center; gap: 10px; }
  .pl .cr b { font: 700 46px/.9 var(--disp); color: var(--muted); min-width: 24px; text-align: right; }
  .pl.lead .cr b { color: var(--gold); }
  .pips { display: grid; gap: 3px; }
  .pips svg { display: block; color: #2a3142; }
  .pips svg.on { color: var(--gold); }
  .elx { display: flex; align-items: center; gap: 8px; margin-top: 9px; }
  .elx .bar { flex: 1; display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; height: 8px; max-width: 240px; }
  .elx .bar span { border-radius: 2px; background: #232a39; overflow: hidden; }
  .elx .bar span i { display: block; height: 100%; width: var(--f, 0%); background: linear-gradient(180deg, #ee8ae6, var(--elixir)); }
  .elx b { font: 600 15px/1 var(--disp); color: var(--elixir); min-width: 26px; }
  .result { padding: 12px 18px; border-top: 1px solid var(--line); color: var(--fg-2); font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  .result b { color: var(--fg); font-weight: 600; }
  .badge { font: 700 9.5px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; padding: 3px 6px; border-radius: 5px; white-space: nowrap; }
  .badge.up { background: rgba(255,184,41,.16); color: var(--gold); } .badge.ff { background: rgba(255,97,102,.13); color: var(--loss); } .badge.dr { background: rgba(143,154,179,.16); color: var(--draw); }
  .warn { margin: 0; padding: 12px 18px; border-top: 1px solid var(--line); background: rgba(255,184,41,.07); color: #ffd98a; font-size: 12.5px; }

  .ctl { padding: 14px 18px 16px; }
  .ctl .top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .play { flex: none; width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--gold); color: #1a1200; display: grid; place-items: center; cursor: pointer; }
  .play:hover { filter: brightness(1.08); }
  .clock { font: 600 30px/1 var(--disp); letter-spacing: .02em; white-space: nowrap; }
  .clock small { font: 500 13px/1 var(--body); color: var(--muted); margin-left: 6px; }
  .phase { font: 700 10px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; padding: 4px 7px; border-radius: 5px; white-space: nowrap; background: rgba(217,95,208,.14); color: #ee8ae6; }
  .phase.ot { background: rgba(255,97,102,.14); color: var(--loss); }
  .tog { margin-left: auto; border: 1px solid var(--line-2); background: transparent; border-radius: 9px; padding: 7px 10px; font-weight: 600; font-size: 12.5px; color: var(--muted); cursor: pointer; }
  .tog[aria-pressed="true"] { background: var(--panel-2); color: var(--gold); }
  .speed { display: flex; border: 1px solid var(--line-2); border-radius: 9px; overflow: hidden; }
  .speed button { border: 0; background: transparent; padding: 7px 10px; font-weight: 600; font-size: 12.5px; color: var(--muted); cursor: pointer; }
  .speed button[aria-pressed="true"] { background: var(--panel-2); color: var(--gold); }
  .track { position: relative; margin-top: 14px; height: 26px; }
  .track .marks { position: absolute; left: 7px; right: 7px; top: 0; height: 7px; pointer-events: none; }
  .track .marks i { position: absolute; top: 0; width: 2px; height: 7px; border-radius: 1px; opacity: .85; }
  .track .marks i.reg { top: 9px; height: 12px; width: 1px; background: var(--faint); opacity: 1; }
  input[type=range] { -webkit-appearance: none; appearance: none; position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 16px; background: transparent; margin: 0; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 5px; border-radius: 99px; background: linear-gradient(90deg, var(--gold) var(--p, 0%), #2a3142 var(--p, 0%)); }
  input[type=range]::-moz-range-track { height: 5px; border-radius: 99px; background: #2a3142; }
  input[type=range]::-moz-range-progress { height: 5px; border-radius: 99px; background: var(--gold); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #fff; margin-top: -4.5px; box-shadow: 0 0 0 3px rgba(255,184,41,.25); }
  input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: #fff; }
  .keys { margin: 10px 0 0; color: var(--faint); font-size: 11.5px; }
  kbd { font: 600 10.5px/1 var(--body); border: 1px solid var(--line-2); border-radius: 4px; padding: 2px 5px; color: var(--muted); }

  .ph { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .ph h2 { margin: 0; font: 600 19px/1 var(--disp); letter-spacing: .09em; text-transform: uppercase; }
  .ph span { color: var(--muted); font-size: 12.5px; }
  .log { list-style: none; margin: 0; padding: 4px 0; max-height: 262px; overflow: auto; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
  .log button { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: grid; grid-template-columns: 44px 3px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 18px; font-size: 13px; }
  .log button:hover { background: rgba(255,255,255,.035); }
  .log button:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
  .log .t { color: var(--muted); font-variant-numeric: tabular-nums; }
  .log i { width: 3px; height: 14px; border-radius: 2px; }
  .log .c { text-transform: capitalize; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg-2); }
  .log .w { color: var(--faint); font-size: 11.5px; }
  .log li.past .c { color: var(--muted); } .log li.now button { background: rgba(255,184,41,.08); } .log li.now .c { color: var(--fg); font-weight: 600; }
  .log .none { padding: 18px; color: var(--muted); }
  .decks { padding: 14px 18px 16px; display: grid; gap: 12px; }
  .decks h3 { margin: 0 0 7px; font: 600 11px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 7px; }
  .decks h3 i { width: 8px; height: 8px; border-radius: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { padding: 4px 8px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line-2); font-size: 11.5px; color: var(--fg-2); text-transform: capitalize; }

  /* ---------- match browser ---------- */
  .bar { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; min-height: 34px; }
  .bar .back { margin: 0 0 0 -6px; }
  .bar .sp { flex: 1; }
  .bar .where { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .bar .where b { color: var(--fg-2); font-weight: 600; }
  .ib { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 11px; border: 1px solid var(--line-2); background: var(--panel); border-radius: 9px; font-weight: 600; font-size: 12.5px; color: var(--fg-2); cursor: pointer; white-space: nowrap; }
  .ib:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }
  .ib:disabled { opacity: .35; cursor: default; }
  .ib.sq { width: 34px; padding: 0; justify-content: center; }
  .ib .ct { font: 600 11px/1 var(--body); background: var(--panel-2); border-radius: 99px; padding: 3px 6px; color: var(--muted); }
  #open-rail { display: none; }
  .shell { display: grid; grid-template-columns: 304px minmax(0, 1fr); gap: 20px; align-items: start; }
  .shell.solo { grid-template-columns: minmax(0, 1fr); }
  .rail { position: sticky; top: 18px; display: flex; flex-direction: column; max-height: calc(100vh - 100px); min-height: 260px; overflow: hidden; }
  .rail .ph { padding: 14px 16px; }
  .rail .ph .x { display: none; margin-left: auto; }
  .live { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11.5px; font-weight: 600; }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--win); box-shadow: 0 0 0 0 rgba(61,220,151,.5); animation: pulse 2s infinite; }
  .live.idle i { background: var(--faint); animation: none; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 7px rgba(61,220,151,0); } 100% { box-shadow: 0 0 0 0 rgba(61,220,151,0); } }
  .find { padding: 12px 16px 10px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
  .find label { position: relative; display: block; }
  .find svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
  .find input { width: 100%; height: 34px; padding: 0 10px 0 32px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--bg-2); font-size: 13px; }
  .find input::placeholder { color: var(--faint); }
  .find input:focus { outline: none; border-color: var(--gold); }
  .filt { display: flex; gap: 5px; flex-wrap: wrap; }
  .filt button { border: 1px solid var(--line-2); background: transparent; border-radius: 99px; padding: 4px 10px; font-weight: 600; font-size: 11.5px; color: var(--muted); cursor: pointer; }
  .filt button:hover { color: var(--fg); }
  .filt button[aria-pressed="true"] { background: rgba(255,184,41,.13); border-color: transparent; color: var(--gold); }
  .list { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1; min-height: 0; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
  .list li + li { border-top: 1px solid var(--row); }
  .mt { position: relative; display: block; padding: 10px 16px 11px; }
  .mt:hover { background: rgba(255,255,255,.03); }
  .mt:focus-visible { outline-offset: -2px; }
  .mt.cur { background: linear-gradient(90deg, rgba(255,184,41,.10), rgba(255,184,41,.02)); }
  .mt.cur::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--gold); }
  .ms { display: grid; grid-template-columns: 3px minmax(0, 1fr) auto; gap: 9px; align-items: center; padding: 2px 0; }
  .ms i { width: 3px; height: 15px; border-radius: 2px; }
  .ms .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-size: 13.5px; }
  .ms b { font: 600 21px/1 var(--disp); color: var(--muted); min-width: 14px; text-align: right; }
  .ms.won .n { color: var(--fg); font-weight: 600; } .ms.won b { color: var(--gold); }
  .mt .ft { display: flex; gap: 7px; align-items: center; margin-top: 5px; padding-left: 12px; color: var(--faint); font-size: 11.5px; min-height: 16px; }
  .mt .ft .r { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; }
  .mt .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }
  .badge.k3 { background: rgba(90,168,255,.14); color: var(--p0); }
  .eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 10px; }
  .eq i { width: 2px; height: 100%; background: var(--gold); border-radius: 1px; transform-origin: bottom; animation: eq .9s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: -.3s; } .eq i:nth-child(3) { animation-delay: -.6s; }
  .eq.still i { animation: none; transform: scaleY(.45); }
  @keyframes eq { 0%, 100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }
  .np { color: var(--gold); font-weight: 600; }
  .list .none { padding: 30px 18px; text-align: center; color: var(--muted); font-size: 13px; }
  .list .none b { display: block; color: var(--fg-2); font: 600 18px/1.1 var(--disp); letter-spacing: .05em; text-transform: uppercase; margin-bottom: 6px; }
  .rf { display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-top: 1px solid var(--line); color: var(--fg-2); font-size: 12.5px; }
  .rf span { flex: 1; } .rf small { display: block; color: var(--faint); font-size: 11px; }
  .sw { flex: none; position: relative; width: 36px; height: 20px; border-radius: 99px; border: 0; background: #2a3142; cursor: pointer; transition: background .15s; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .sw[aria-checked="true"] { background: var(--gold); } .sw[aria-checked="true"]::after { transform: translateX(16px); }
  .scrim { display: none; }
  .busy { position: absolute; inset: 0; z-index: 4; display: grid; place-items: center; background: rgba(9,11,16,.6); backdrop-filter: blur(2px); line-height: 1.4; color: var(--fg-2); text-align: center; }
  .over .acts { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .btn.go { background: var(--gold); border-color: var(--gold); color: #1a1200; }
  .btn.go:hover { color: #1a1200; filter: brightness(1.08); }
  .upnext { margin: 16px auto 0; max-width: 300px; font-size: 12.5px; color: var(--muted); }
  .upnext b { display: block; font: 600 17px/1.2 var(--disp); letter-spacing: .02em; text-transform: none; color: var(--fg); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .upnext .cd { display: block; height: 3px; border-radius: 99px; background: #2a3142; margin-top: 10px; overflow: hidden; }
  .upnext .cd i { display: block; height: 100%; width: 0; background: var(--gold); }
  .upnext .cd.run i { width: 100%; transition: width 6s linear; }
  .upnext button { all: unset; cursor: pointer; margin-top: 8px; color: var(--muted); font-size: 11.5px; text-decoration: underline; text-underline-offset: 2px; }
  .upnext button:hover { color: var(--fg); }

  @media (max-width: 1240px) {
    .shell { grid-template-columns: minmax(0, 1fr); }
    #open-rail { display: inline-flex; }
    .rail { position: fixed; z-index: 20; inset: 0 auto 0 0; width: min(340px, 90vw); max-height: none; border-radius: 0 var(--r) var(--r) 0; border-left: 0;
      padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px);
      transform: translateX(-102%); visibility: hidden; transition: transform .22s ease, visibility 0s .22s; box-shadow: 20px 0 60px rgba(0,0,0,.5); }
    .rail.open { transform: none; visibility: visible; transition: transform .22s ease; }
    .rail .ph .x { display: inline-flex; } .rail .live { margin-left: 0; }
    .scrim { display: block; position: fixed; inset: 0; z-index: 19; background: rgba(5,7,11,.6); opacity: 0; pointer-events: none; transition: opacity .2s; }
    .scrim.open { opacity: 1; pointer-events: auto; }
  }
  @media (max-width: 520px) { .bar .where, .ib .lbl { display: none; } }

  .msg { max-width: 460px; margin: 16vh auto 0; text-align: center; color: var(--fg-2); }
  .msg b { display: block; font: 700 36px/1 var(--disp); letter-spacing: .04em; text-transform: uppercase; color: var(--fg); margin-bottom: 10px; }
  .msg .btn { margin-top: 18px; }
  .msg code { font: 500 12.5px/1.2 ui-monospace, "SF Mono", Menlo, Consolas, monospace; background: var(--panel-2); border: 1px solid var(--line-2);
    padding: 6px 9px; border-radius: 7px; color: #ffd98a; overflow-wrap: anywhere; display: inline-block; margin-top: 12px; }
  .spin { width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--line-2); border-top-color: var(--gold); margin: 0 auto 16px; animation: sp 0.8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }

  @media (max-width: 860px) {
    .wrap { padding-block: 12px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    .stage { grid-template-columns: minmax(0, 1fr); }
    .board { justify-self: center; }
    .side { max-width: none; }
    .log { max-height: 220px; }
    .keys { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2s; } .eq i, .live i { animation: none; } .rail { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <a class="back" href="/"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Standings</a>
    <span class="sp"></span>
    <span class="where" id="where"></span>
    <button class="ib sq" id="newer" type="button" disabled aria-label="Newer match" title="Newer match (P)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>

<script src="/arena.js"></script>
<script>
"use strict";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clock = (ticks, tps) => { const s = Math.floor(ticks / tps); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const cardName = (c) => String(c).replace(/_/g, " ");
const P = ["#5aa8ff", "#ff6f91"];
const ICON = { play: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>',
               pause: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
               crown: '<svg width="13" height="11" viewBox="0 0 24 20" fill="currentColor"><path d="M2 5l5 4.5L12 2l5 7.5L22 5l-2 13H4z"/></svg>' };

let T = null, meta = null, frames = null, events = null, deaths = null, life = null, labels = true;
try { labels = localStorage.getItem("replay-names") !== "0"; } catch (e) {}
let tick = 0, playing = false, speed = 1, hover = null, evIdx = -1, looping = false, onFinish = null, onPlay = null;
const cv = $("cv"), board = createArena(cv);

// A trace from the server is used as is. One written by gym/examples/record_trace.py
// ({t, crowns, elixir, ents:[owner, card, x, y, hp, flags, id, half]}) is reshaped to match.
function normalise(d) {
  if (Array.isArray(d.frames[0])) return d;
  const m = d.meta;
  const fr = d.frames.map((f) => [f.t, f.crowns, f.elixir, f.ents.map((e) => [e[6], e[0], e[1], e[2], e[3], e[4], e[5], e[7] || 0, e[7] || 0])]);
  return { meta: Object.assign({}, m, { ticks: fr.length ? fr[fr.length - 1][0] : 0, regulation: m.regulation || m.tps * 180, faithful: true }),
    frames: fr, events: null,
    match: { p0: "Blue", p1: "Red", outcome: m.outcome, crowns: m.crowns, seed: m.seed, level: m.level } };
}
function start(data) {
  T = normalise(data); meta = T.meta; frames = T.frames; events = T.events || [];
  // everything that is in one frame and gone from the next: a unit that died, a tower that fell
  deaths = [];
  for (let i = 0; i + 1 < frames.length; i++) {
    const nx = new Set(frames[i + 1][3].map((e) => e[0]));
    for (const e of frames[i][3]) if (!nx.has(e[0])) deaths.push({ t: frames[i + 1][0], o: e[1], x: e[3], y: e[4], r: e[7] || .5,
      tower: !!(e[6] & 2), king: meta.cards[e[2]] === "king_tower", hw: e[7], hh: e[8] });
  }
  // when each thing first appears and when it finishes deploying
  life = new Map();
  for (const f of frames) for (const e of f[3]) {
    let l = life.get(e[0]); if (!l) life.set(e[0], l = [f[0], null]);
    if (l[1] == null && !(e[6] & 4)) l[1] = f[0];
  }
  board.configure(meta, frames[0][3].filter((e) => e[6] & 2).map((e) => ({ o: e[1], x: e[3], y: e[4], king: meta.cards[e[2]] === "king_tower", hw: e[7], hh: e[8] })));
  setup();
}

function setup() {
  const m = T.match, tps = meta.tps;
  document.title = `${m.p0} vs ${m.p1} · Replay`;
  $("n0").textContent = m.p0; $("n1").textContent = m.p1;
  $("n0").title = m.p0; $("n1").title = m.p1;
  for (const p of [0, 1]) { $("e" + p).innerHTML = "<span><i></i></span>".repeat(10); $("k" + p).innerHTML = ICON.crown.repeat(3); }
  const won = m.outcome === 1 ? 0 : m.outcome === 2 ? 1 : -1;
  for (const p of [0, 1]) $("pl" + p).classList.toggle("won", p === won);
  const tiebreak = won >= 0 && !m.forfeit && m.crowns[0] === m.crowns[1]; // level on crowns: decided by tower HP
  const tags = (m.forfeit ? `<span class="badge ff">Forfeit</span>` : "") + (m.upset ? `<span class="badge up">Upset</span>` : "") + (m.outcome === 3 ? `<span class="badge dr">Draw</span>` : "");
  $("result").innerHTML = (won >= 0 ? `<span><b>${esc(won ? m.p1 : m.p0)}</b> won ${m.crowns[won]}–${m.crowns[1 - won]}${tiebreak ? " on tower health" : ""}</span>` : `<span><b>Draw</b> ${m.crowns[0]}–${m.crowns[1]}</span>`)
    + `<span>·</span><span>${clock(meta.ticks, tps)} of play</span>` + (m.rated === false ? `<span>·</span><span>Unrated human game</span>` : m.delta == null ? "" : `<span>·</span><span>±${Math.abs(m.delta).toFixed(1)} rating</span>`)
    + (m.seed == null ? "" : `<span>·</span><span>seed ${esc(m.seed)}</span>`) + tags;
  const w = $("warn"); w.hidden = meta.faithful !== false;
  w.textContent = "This replay was recorded on an older build of the simulator. What you see here is a re-run on the current build and may not match the original match.";
  $("total").textContent = "/ " + clock(meta.ticks, tps);
  const scrub = $("scrub"); scrub.max = meta.ticks;
  $("marks").innerHTML = events.map((e) => `<i style="left:${(e[0] / meta.ticks) * 100}%;background:${P[e[1]]}"></i>`).join("")
    + (meta.ticks > meta.regulation ? `<i class="reg" style="left:${(meta.regulation / meta.ticks) * 100}%" title="Overtime starts"></i>` : "");
  $("speed").innerHTML = [1, 2, 4, 8].map((s) => `<button type="button" data-s="${s}" aria-pressed="${s === speed}">${s}×</button>`).join("");
  $("logp").hidden = !T.events;
  $("log-n").textContent = events.length ? `${events.length} cards played` : "";
  $("log").innerHTML = events.length ? events.map((e, i) => `<li data-i="${i}"><button type="button" data-t="${e[0]}">
      <span class="t">${clock(e[0], tps)}</span><i style="background:${P[e[1]]}"></i><span class="c">${esc(cardName(e[2]))}</span><span class="w">${e[2] === "ability" ? "" : e[3].toFixed(0) + ", " + e[4].toFixed(0)}</span></button></li>`).join("")
    : `<li class="none">Neither agent played a card.</li>`;
  const d = $("decks"); d.hidden = !(m.deck0 || m.deck1);
  d.innerHTML = [[1, m.p1, m.deck1], [0, m.p0, m.deck0]].filter((x) => x[2]).map(([p, n, dk]) =>
      `<div><h3><i style="background:${P[p]}"></i>${esc(n)}</h3><div class="chips">${dk.map((c) => `<span class="chip">${esc(cardName(c))}</span>`).join("")}</div></div>`).join("");
  $("msg").hidden = true; $("stage").hidden = false;
  // ?t=<seconds> opens the replay paused at that moment, so a link can point at a play
  const at = parseFloat(new URLSearchParams(location.search).get("t"));
  resize(); seek(at > 0 ? at * tps : 0);
  setPlaying(!(at > 0) && !matchMedia("(prefers-reduced-motion: reduce)").matches);
  if (!looping) { looping = true; requestAnimationFrame(loop); }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw); // unit labels use the web font
}

// ---------- sizing ----------
function resize() {
  const narrow = innerWidth <= 860, room = $("stage").clientWidth;
  const maxH = Math.max(360, innerHeight - (narrow ? 120 : 96));
  const maxW = narrow ? room - 2 : Math.min(560, room * 0.5);
  board.resize(maxW, maxH);
  draw();
}
addEventListener("resize", () => { if (meta) resize(); });

// ---------- frame lookup + interpolation ----------
function frameAt(t) {
  let lo = 0, hi = frames.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (frames[mid][0] <= t) lo = mid; else hi = mid - 1; }
  return lo;
}
function scene(t) {
  const i = frameAt(t), a = frames[i], b = frames[Math.min(i + 1, frames.length - 1)];
  const k = b[0] > a[0] ? Math.max(0, Math.min(1, (t - a[0]) / (b[0] - a[0]))) : 0;
  const next = new Map(b[3].map((e) => [e[0], e]));
  const ents = a[3].map((e) => {
    const n = next.get(e[0]), u = { id: e[0], o: e[1], name: meta.cards[e[2]] || "unit", x: e[3], y: e[4], hp: e[5], f: e[6], hw: e[7], hh: e[8], a: 1, hit: false, dx: 0, dy: 0 };
    const l = life.get(e[0]); u.t0 = l ? l[0] : 0; u.t1 = l && l[1] != null ? l[1] : u.t0;
    if (n) { u.dx = n[3] - e[3]; u.dy = n[4] - e[4]; u.x += u.dx * k; u.y += u.dy * k; u.hp += (n[5] - e[5]) * k; u.hit = n[5] < e[5] - 0.0005; }
    else if (a !== b) u.a = 1 - k;                // gone by the next frame: fade out
    return u;
  });
  return { t, crowns: a[1], elixir: [a[2][0] + (b[2][0] - a[2][0]) * k, a[2][1] + (b[2][1] - a[2][1]) * k], ents, events, deaths, hover: hover && hover.id, labels };
}
function draw() { if (meta) board.draw(scene(tick)); }

// ---------- side panel ----------
function hud() {
  const s = scene(tick), tps = meta.tps;
  for (const p of [0, 1]) {
    $("c" + p).textContent = s.crowns[p];
    $("pl" + p).classList.toggle("lead", s.crowns[p] > s.crowns[1 - p]);
    const pips = $("k" + p).children;
    for (let i = 0; i < 3; i++) pips[i].classList.toggle("on", 2 - i < s.crowns[p]);
    const el = s.elixir[p]; $("ev" + p).textContent = Math.floor(el);
    const cells = $("e" + p).children;
    for (let i = 0; i < 10; i++) cells[i].firstChild.style.setProperty("--f", Math.round(Math.max(0, Math.min(1, el - i)) * 100) + "%");
  }
  $("now").textContent = clock(tick, tps);
  const ph = $("phase"), ot = tick >= meta.regulation, x2 = !ot && tick >= meta.regulation - 60 * tps;
  ph.hidden = !(ot || x2); ph.className = "phase" + (ot ? " ot" : ""); ph.textContent = ot ? "Overtime" : "2× elixir";
  const scrub = $("scrub"); scrub.value = Math.round(tick); scrub.style.setProperty("--p", (tick / meta.ticks) * 100 + "%");
  // highlight the latest deploy at or before now; keep it in view while playing
  let i = -1; while (i + 1 < events.length && events[i + 1][0] <= tick) i++;
  if (i !== evIdx) {
    evIdx = i;
    const items = $("log").children;
    for (let k = 0; k < items.length; k++) { items[k].classList.toggle("past", k < i); items[k].classList.toggle("now", k === i); }
    if (i >= 0 && playing && items[i]) { const li = items[i], box = $("log"); box.scrollTop = li.offsetTop - box.clientHeight / 2 + li.clientHeight / 2; }
  }
}

// ---------- playback ----------
let prev = 0;
function loop(ts) {
  const dt = Math.min(0.1, (ts - prev) / 1000 || 0); prev = ts;
  if (playing) {
    tick = Math.min(meta.ticks, tick + dt * meta.tps * speed);
    if (tick >= meta.ticks) { setPlaying(false); finish(); }
    draw(); hud();
  }
  requestAnimationFrame(loop);
}
function finish() {
  const m = T.match, o = m.outcome;
  $("over-t").textContent = o === 3 ? "Draw" : (o === 1 ? m.p0 : m.p1) + " wins";
  $("over-s").textContent = `${m.crowns[0]}–${m.crowns[1]}` + (m.forfeit ? " · decided by forfeit" : o !== 3 && m.crowns[0] === m.crowns[1] ? " · decided on tower health" : "");
  $("over").hidden = false;
  if (onFinish) onFinish();
}
function setPlaying(on) {
  if (on && tick >= meta.ticks) tick = 0;
  playing = on; if (on) $("over").hidden = true;
  $("play").innerHTML = on ? ICON.pause : ICON.play; $("play").setAttribute("aria-label", on ? "Pause" : "Play");
  if (onPlay) onPlay(on);
}
function seek(t) { tick = Math.max(0, Math.min(meta.ticks, t)); $("over").hidden = true; evIdx = -2; draw(); hud(); }

$("play").addEventListener("click", () => setPlaying(!playing));
$("again").addEventListener("click", () => { seek(0); setPlaying(true); });
$("scrub").addEventListener("input", (e) => seek(+e.target.value));
$("speed").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; speed = +b.dataset.s;
  for (const x of $("speed").children) x.setAttribute("aria-pressed", String(x === b)); });
$("labels").setAttribute("aria-pressed", String(labels));
$("labels").addEventListener("click", () => { labels = !labels; $("labels").setAttribute("aria-pressed", String(labels));
  try { localStorage.setItem("replay-names", labels ? "1" : "0"); } catch (e) {} draw(); });
$("log").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) seek(+b.dataset.t); });
addEventListener("keydown", (e) => {
  if (!meta || $("stage").hidden || e.target.matches("input:not([type=range])") || e.target.matches("input, button") && e.key === " ") return;
  if (e.key === " ") { e.preventDefault(); setPlaying(!playing); }
  else if (e.key === "ArrowRight") { e.preventDefault(); seek(tick + 5 * meta.tps); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); seek(tick - 5 * meta.tps); }
});

// ---------- hover: which unit is under the pointer ----------
cv.addEventListener("pointermove", (e) => {
  const r = cv.getBoundingClientRect(), h = board.pick(e.clientX - r.left, e.clientY - r.top), tip = $("tip");
  hover = h && h.e;
  if (h) { tip.hidden = false; tip.style.left = h.x + "px"; tip.style.top = h.y + "px";
    tip.innerHTML = `<b style="color:${P[h.e.o]}">${esc(cardName(h.e.name))}</b><span>${Math.round(h.e.hp * 100)}% HP</span>`; }
  else tip.hidden = true;
  if (!playing) draw();
});
cv.addEventListener("pointerleave", () => { hover = null; $("tip").hidden = true; if (!playing) draw(); });

// ---------- match browser: finds replays so nobody has to arrive with an id ----------
const TPS = 20, POLL = 8000, WAIT = 6000;
let list = [], cur = null, q = "", filt = "all", auto = true, skew = 0, newest = null, loadSeq = 0, timer = 0, sig = "", lastNote = null;
const fresh = new Set();
try { auto = localStorage.getItem("replay-autonext") !== "0"; } catch (e) {}

const urlId = () => { const v = new URLSearchParams(location.search).get("id"); return v && /^\d{1,12}$/.test(v) ? +v : null; };
const ago = (at) => {
  const s = Math.max(0, Math.round((Date.now() + skew - at) / 1000));
  if (s < 8) return "just now"; if (s < 60) return s + "s ago";
  if (s < 3600) return Math.floor(s / 60) + "m ago"; if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
};
const close = (m) => m.outcome !== 3 && !m.forfeit && m.crowns[0] === m.crowns[1];
const KEEP = { all: () => true, up: (m) => m.upset, k3: (m) => Math.max(m.crowns[0], m.crowns[1]) === 3, tb: (m) => m.outcome === 3 || close(m) };
function shown() {
  const k = q.trim().toLowerCase();
  return list.filter((m) => KEEP[filt](m) && (!k || m.p0.toLowerCase().includes(k) || m.p1.toLowerCase().includes(k)));
}
// newer / older than the one on screen, within what the list currently shows
function around() {
  const v = shown(), i = v.findIndex((m) => m.id === cur);
  if (i >= 0) return { newer: v[i - 1] || null, older: v[i + 1] || null, i, n: v.length };
  return { newer: v.filter((m) => m.id > cur).pop() || null, older: v.find((m) => m.id < cur) || null, i: -1, n: v.length };
}
function renderList() {
  const v = shown(), box = $("list");
  if (!v.length) {
    box.innerHTML = list.length ? `<li class="none"><b>Nothing here</b>No recent match fits that filter.</li>`
      : `<li class="none"><b>No replays yet</b>Matches show up here as soon as two agents finish one.</li>`;
  } else box.innerHTML = v.map((m) => {
    const w0 = m.outcome === 1, w1 = m.outcome === 2, on = m.id === cur;
    const tag = m.rated === false ? `<span class="badge dr">Unrated</span>` : m.forfeit ? `<span class="badge ff">Forfeit</span>` : m.outcome === 3 ? `<span class="badge dr">Draw</span>`
      : m.upset ? `<span class="badge up">Upset</span>` : Math.max(m.crowns[0], m.crowns[1]) === 3 ? `<span class="badge k3">King down</span>`
      : close(m) ? `<span class="badge dr" title="Level on crowns; decided by tower health">Tiebreak</span>` : "";
    const right = on ? `<span class="r np"><span class="eq${playing ? "" : " still"}" aria-hidden="true"><i></i><i></i><i></i></span>${playing ? "Playing" : "Open"}</span>`
      : fresh.has(m.id) ? `<span class="r"><span class="dot" title="New since you opened this page"></span></span>` : "";
    return `<li><a class="mt${on ? " cur" : ""}" href="/replay?id=${m.id}" data-id="${m.id}"${on ? ` aria-current="true"` : ""} aria-label="${esc(`${m.p0} ${m.crowns[0]}, ${m.p1} ${m.crowns[1]}`)}">
      <div class="ms${w0 ? " won" : ""}"><i style="background:var(--p0)"></i><span class="n">${esc(m.p0)}</span><b>${m.crowns[0]}</b></div>
      <div class="ms${w1 ? " won" : ""}"><i style="background:var(--p1)"></i><span class="n">${esc(m.p1)}</span><b>${m.crowns[1]}</b></div>
      <div class="ft"><span>${ago(m.at)}</span>·<span>${clock(m.ticks, TPS)}</span>${tag}${right}</div></a></li>`;
  }).join("");
  const a = around();
  $("newer").disabled = !a.newer; $("older").disabled = !a.older;
  $("where").innerHTML = cur == null ? "" : `Match <b>#${cur}</b>` + (a.i >= 0 ? ` · ${a.i + 1} of ${a.n}` : "");
  const n = $("rail-n"); n.hidden = !list.length; n.textContent = list.length;
}
function reveal() { const el = $("list").querySelector(".cur"); if (el) el.scrollIntoView({ block: "nearest" }); }

function note(title, text, spin) {
  if (meta) { playing = false; }
  lastNote = spin ? null : [title, text];
  $("stage").hidden = true; $("busy").hidden = true; $("msg").hidden = false;
  const latest = list.find((m) => m.id !== cur);
  $("msg").innerHTML = spin ? `<div class="spin"></div><span>${esc(text)}</span>`
    : `<b>${esc(title)}</b><span>${esc(text)}</span><br>` + (latest ? `<button class="btn go" type="button" id="latest">Watch the latest match</button>` : `<a class="btn" href="/">Back to the standings</a>`);
  const b = $("latest"); if (b) b.addEventListener("click", () => watch(latest.id, "push"));
}
async function watch(id, how) {
  stopCount(); cur = id; fresh.delete(id);
  if (how) history[how + "State"](null, "", "/replay?id=" + id);
  renderList(); reveal(); drawer(false);
  if (meta && !$("stage").hidden) { setPlaying(false); $("over").hidden = true; $("busy").hidden = false; }
  else note("", "Rebuilding the match…", true);
  const seq = ++loadSeq;
  let res, data;
  try { res = await fetch("/api/replay/" + id); } catch (e) { return seq === loadSeq && note("Can't reach the server", "Check your connection and try again."); }
  if (seq !== loadSeq) return;
  if (res.status === 404) return note("Replay not found", "Match #" + id + " has no saved replay.");
  if (!res.ok) return note("Replay failed to load", "The server could not rebuild this match.");
  try { data = await res.json(); } catch (e) { return seq === loadSeq && note("Replay failed to load", "The server sent something unreadable."); }
  if (seq !== loadSeq) return;
  $("busy").hidden = true; lastNote = null;
  start(data);
}

async function refresh() {
  let d;
  try { const r = await fetch("/api/standings"); if (!r.ok) throw 0; d = await r.json(); } catch (e) { return false; }
  skew = d.now - Date.now();
  const got = d.matches.filter((m) => m.replay);
  if (newest != null) for (const m of got) if (m.id > newest && m.id !== cur) fresh.add(m.id);
  if (got.length) newest = Math.max(newest == null ? 0 : newest, got[0].id);
  const sg = JSON.stringify(got); const same = sg === sig; sig = sg; list = got;
  const live = $("live"), s = d.stats || {};
  live.className = "live" + (s.live ? "" : " idle"); live.lastElementChild.textContent = s.live ? s.live + " live" : "Idle";
  if (!same) renderList();
  return true;
}
async function boot() {
  const id = urlId();
  if (id != null) watch(id, null);
  const ok = await refresh();
  if (id != null) { reveal(); if (lastNote && !$("msg").hidden) note(lastNote[0], lastNote[1]); return; }
  if (list.length) return watch(list[0].id, "replace");
  note(ok ? "No replays yet" : "Can't reach the server", ok ? "The newest match will start playing here as soon as one finishes." : "Check your connection and try again.");
}
setInterval(async () => {
  if (document.hidden) return;
  await refresh();
  if (cur == null && list.length) watch(list[0].id, "replace");   // was waiting for the first match
}, POLL);

// ---------- what plays after the final whistle ----------
function stopCount() { clearTimeout(timer); timer = 0; const cd = document.querySelector("#upnext .cd"); if (cd) cd.remove(); const c = $("stay"); if (c) c.remove(); }
onFinish = () => {
  const nx = around().older, up = $("upnext"), nb = $("next-b");
  nb.hidden = up.hidden = !nx;
  if (!nx) return;
  const run = auto && !matchMedia("(prefers-reduced-motion: reduce)").matches;
  up.innerHTML = `Up next<b>${esc(nx.p0)} vs ${esc(nx.p1)}</b>` + (run ? `<span class="cd"><i></i></span><button type="button" id="stay">Stay on this match</button>` : "");
  if (!run) return;
  requestAnimationFrame(() => requestAnimationFrame(() => { const cd = up.querySelector(".cd"); if (cd) cd.classList.add("run"); }));
  $("stay").addEventListener("click", stopCount);
  timer = setTimeout(() => { if (!$("over").hidden) watch(nx.id, "push"); }, WAIT);
};
onPlay = (on) => { if (on) stopCount(); const eq = document.querySelector("#list .eq"); if (eq) { eq.classList.toggle("still", !on); eq.nextSibling.textContent = on ? "Playing" : "Open"; } };
$("scrub").addEventListener("input", stopCount);
$("next-b").addEventListener("click", () => { const nx = around().older; if (nx) watch(nx.id, "push"); });

// ---------- controls ----------
function drawer(on) {
  $("rail").classList.toggle("open", on); $("scrim").classList.toggle("open", on);
  $("open-rail").setAttribute("aria-expanded", String(on));
}
$("open-rail").addEventListener("click", () => { drawer(true); reveal(); });
$("close-rail").addEventListener("click", () => drawer(false));
$("scrim").addEventListener("click", () => drawer(false));
$("list").addEventListener("click", (e) => {
  const a = e.target.closest("a.mt"); if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
  e.preventDefault(); const id = +a.dataset.id;
  if (id === cur && meta && !$("stage").hidden) return drawer(false);
  watch(id, "push");
});
$("q").addEventListener("input", (e) => { q = e.target.value; renderList(); });
$("filt").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; filt = b.dataset.f;
  for (const x of $("filt").children) x.setAttribute("aria-pressed", String(x === b)); renderList(); });
$("auto").setAttribute("aria-checked", String(auto));
$("auto").addEventListener("click", () => { auto = !auto; $("auto").setAttribute("aria-checked", String(auto));
  try { localStorage.setItem("replay-autonext", auto ? "1" : "0"); } catch (e) {} if (!auto) stopCount(); });
const step = (k) => { const m = around()[k]; if (m) watch(m.id, "push"); };
$("newer").addEventListener("click", () => step("newer"));
$("older").addEventListener("click", () => step("older"));
addEventListener("keydown", (e) => {
  if (e.key === "Escape") return drawer(false);
  if (e.target.matches("input") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "n" || e.key === "N") step("older"); else if (e.key === "p" || e.key === "P") step("newer");
});
addEventListener("popstate", () => { const id = urlId(); if (id != null && id !== cur) watch(id, null); });
setInterval(() => { if (!document.hidden && list.length) { const top = $("list").scrollTop; renderList(); $("list").scrollTop = top; } }, 30000);
$("keys-nav").hidden = false;
boot();
</script>
</body>
</html>
